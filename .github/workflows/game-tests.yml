# Every game test on GitHub's computers (test health plan, docs/plans/test-health.md), split over 4 servers that run
# at the same time (one job each). It runs:
#   - on every push to master,
#   - on a push to any branch whose last commit message contains "[full run]",
#   - by hand: GitHub, Actions tab, "Game tests", "Run workflow" (pick the branch; optionally only some tests).
# The minutes of all 4 jobs count against the account's free minutes, so it does not run on every push.
name: Game tests

on:
  push:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Only these tests or categories (ANTCOLONIES_TESTS, e.g. "antnest,away"); empty = all'
        required: false
        default: ''

jobs:
  game-tests:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || contains(github.event.head_commit.message, '[full run]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ANTCOLONIES_TESTS: ${{ github.event.inputs.tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Game tests, share ${{ matrix.shard }} of 4
        run: |
          chmod +x gradlew
          ./gradlew runGameTestShard${{ matrix.shard }} -PtestShards=4

      - name: List the failures
        if: always()
        run: |
          log=run-test-shards/${{ matrix.shard }}/logs/latest.log
          {
            echo "### Share ${{ matrix.shard }} of 4"
            grep -o "shard [0-9]*/4: running [0-9]* of [0-9]* game tests" "$log" || true
            grep -o "[0-9]* required tests failed\|All [0-9]* required tests passed" "$log" || echo "did not finish"
            grep "failed at" "$log" | sed -E 's/.*LogTestReporter[^:]*: /- /; s/ failed at [^!]*!/:/' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-test-logs-${{ matrix.shard }}
          path: run-test-shards/${{ matrix.shard }}/logs/
          retention-days: 7
