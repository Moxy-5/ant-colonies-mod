# Every game test on GitHub's computers (test health plan, docs/plans/test-health.md), split over 4 servers that run
# at the same time (one job each). It runs only by hand (the user, 2026-10-25: the game tests run on the user's PC,
# never by themselves on GitHub): GitHub, Actions tab, "Game tests", "Run workflow" (pick the branch; optionally only
# some tests). The minutes of all 4 jobs count against the account's free minutes.
# Since the split (docs/plans/mod-split.md, step S8) the repository holds three mods (framework\, savanna\, desert\,
# tools/mod_paths.py); every test server loads all three and runs both species mods' game tests. A fifth job, at the
# same time, builds the three mods with their unit tests and runs the tools' own checks (body plans, anim lab).
name: Game tests

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Only these tests or categories (ANTCOLONIES_TESTS, e.g. "antnest,away"); empty = all'
        required: false
        default: ''

jobs:
  build-and-tools:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || contains(github.event.head_commit.message, '[full run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the three mods and run their unit tests
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The tools' checks (each model found in its mod, body plans, the worker's clips)
        run: |
          python tools/mod_paths.py
          python tools/body_plan.py check
          python tools/anim_lab.py check worker_ant --fresh

      - name: Keep the unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '*/build/reports/tests/'
          retention-days: 7

  game-tests:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || contains(github.event.head_commit.message, '[full run]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ANTCOLONIES_TESTS: ${{ github.event.inputs.tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Game tests, share ${{ matrix.shard }} of 4
        run: |
          chmod +x gradlew
          ./gradlew runGameTestShard${{ matrix.shard }} -PtestShards=4

      - name: List the failures
        if: always()
        run: |
          log=run-test-shards/${{ matrix.shard }}/logs/latest.log
          {
            echo "### Share ${{ matrix.shard }} of 4"
            grep -o "shard [0-9]*/4: running [0-9]* of [0-9]* game tests" "$log" || true
            grep -o "[0-9]* required tests failed\|All [0-9]* required tests passed" "$log" || echo "did not finish"
            grep "failed at" "$log" | sed -E 's/.*LogTestReporter[^:]*: /- /; s/ failed at [^!]*!/:/' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-test-logs-${{ matrix.shard }}
          path: run-test-shards/${{ matrix.shard }}/logs/
          retention-days: 7
