<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanna river colours</title>
<style>
  :root { --bg: #f4f1ea; --fg: #2c2c2a; --muted: #6b6a64; --line: #d3d1c7; --pick: #2f6b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1f1d; --fg: #ecebe4; --muted: #a9a79e; --line: #44443f; --pick: #8fd19e; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  #panel { padding: 10px 16px; display: grid; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row b { width: 130px; font-weight: 500; }
  button { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--pick); color: var(--pick); font-weight: 500; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1px solid #0003; }
  #note { color: var(--muted); font-size: 13px; }
  canvas { display: block; width: 100%; height: calc(100vh - 230px); min-height: 380px; }
</style>
</head>
<body>
<div id="panel">
  <div id="note">A piece of floodplain: the river in front, an oxbow (cut-off bend) on the far side, a pan near the right, the plain rising at the back edges. Minecraft's own textures, tinted as the game tints them. Drag to turn, scroll to zoom.</div>
</div>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D = /*DATA*/null;
const X = 72, Z = 68;
const zc = x => 30 + 6 * Math.sin(x / 10);
const OPTIONS = {
  river: { label: "River water", pick: 2, picked: 2, list: [
    ["Minecraft today", 0x3F76E4, 0x050533], ["Swamp (for scale)", 0x617B64, 0x232317],
    ["A olive silt", 0x5C6E45, 0x1E2414], ["B brown-green", 0x6E6A44, 0x24210F], ["C dark tea", 0x4B5534, 0x171A0E]] },
  pool: { label: "Pool water", pick: 3, picked: 3, list: [
    ["Same as the river", null, null], ["Minecraft today", 0x3F76E4, 0x050533],
    ["A algae green", 0x4F7B3A, 0x172612], ["B deep green", 0x3E5F33, 0x111C0D], ["C green-brown", 0x5E7040, 0x1D2312]] },
  grass: { label: "Floodplain grass", pick: 2, picked: 2, list: [
    ["Savanna today", "savanna"], ["A fresh green (plains)", "plains"], ["B deep green", 0x6F9B45],
    ["C olive green", 0x7E9A4A], ["D darker still", 0x5A7F38]] },
  bank: { label: "Bank step", pick: 3, list: [
    ["Step 1 block back from the water", 1], ["Step 2 blocks back", 2], ["Step 3 blocks back", 3],
    ["Step 4 blocks back (your pick)", 4], ["Step 5 blocks back", 5]] },
  sand: { label: "River edges", pick: 5, list: [["1 Silt bars on the inside of bends", "siltbars"],
    ["2 Sand bars on the inside of bends", "sandbars"], ["3 Silt and mud, ragged, all along", "mix"],
    ["4 Sand stripe (before)", "stripe"], ["5 Grass to the water", "none"],
    ["6 Silt bars, trampled mud at the water and in the hollows (my pick)", "siltmud"],
    ["7 Bars sand at the head, silt at the tail, mud at the water", "graded"]] },
  view: { label: "View", pick: 0, list: [["From above"], ["Under the river"]] },
};
const state = {};
for (const k in OPTIONS) state[k] = OPTIONS[k].pick;

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
function canvasOf(img, w, h) { const c = document.createElement("canvas"); c.width = w || img.width; c.height = h || img.height; c.getContext("2d").drawImage(img, 0, 0); return c; }
function tinted(img, hex, w, h) {
  const c = canvasOf(img, w, h), g = c.getContext("2d"), d = g.getImageData(0, 0, c.width, c.height);
  const r = (hex >> 16 & 255) / 255, gg = (hex >> 8 & 255) / 255, b = (hex & 255) / 255;
  for (let i = 0; i < d.data.length; i += 4) { d.data[i] *= r; d.data[i + 1] *= gg; d.data[i + 2] *= b; }
  g.putImageData(d, 0, 0); return c;
}
function tex(c) { const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; return t; }
function hexCss(h) { return "#" + h.toString(16).padStart(6, "0"); }

let IMG = {}, SAVANNA = 0, PLAINS = 0;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 500);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
camera.position.set(78, 30, -8); controls.target.set(38, 0, 30);

function colourOf(key) { const v = OPTIONS[key].list[state[key]][1]; return v === "savanna" ? SAVANNA : v === "plains" ? PLAINS : v; }

function nearest(x, z) {
  let best = 99, at = x;
  for (let s = -14; s <= 14; s += 0.25) { const xx = x + s, h = Math.hypot(s, z - zc(xx)); if (h < best) { best = h; at = xx; } }
  return { d: best, xx: at };
}
function dist(x, z) { return nearest(x, z).d; }
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function wobble(x, z) { return 0.45 * Math.sin(x * 1.7 + z * 0.9) + 0.4 * Math.sin(x * 0.6 - z * 1.3); }
function siltOf(wet) {
  const s = canvasOf(IMG.sand), dd = canvasOf(IMG.dirt).getContext("2d").getImageData(0, 0, 16, 16).data;
  const g = s.getContext("2d"), p = g.getImageData(0, 0, 16, 16);
  const k = wet ? 0.68 : 0.86;
  for (let i = 0; i < p.data.length; i += 4) {
    const m = [0.45, 0.42, 0.4];
    for (let c = 0; c < 3; c++) p.data[i + c] = (p.data[i + c] * m[c] + dd[i + c] * (1 - m[c])) * k * [1, 0.97, 0.9][c];
  }
  g.putImageData(p, 0, 0); return s;
}

function build() {
  while (scene.children.length) scene.remove(scene.children[0]);
  const bank = OPTIONS.bank.list[state.bank][1], edge = OPTIONS.sand.list[state.sand][1];
  const bedKind = edge === "siltbars" || edge === "mix" || edge === "siltmud" || edge === "graded" ? "silt" : edge === "none" ? "dirt" : "sand";
  const flood = colourOf("grass"), plain = SAVANNA;
  const river = OPTIONS.river.list[state.river], poolOpt = OPTIONS.pool.list[state.pool];
  const pool = poolOpt[1] === null ? river : poolOpt;
  // columns: top solid cell, surface kind, water top cell and kind, grass colour
  const col = [];
  for (let x = 0; x < X; x++) for (let z = 0; z < Z; z++) {
    const nr = nearest(x + 0.5, z + 0.5), d = nr.d;
    // the plain 1 block above the water, a 1-block step down "bank" blocks from the water,
    // then a low strip flush with the water (the river's own low floodplain)
    const out = d - 3.6, PLAIN = 1, strip = out < bank + 0.25 * wobble(x * 0.7, z * 0.7);
    let top = PLAIN + Math.max(0, Math.min(3, Math.floor((d - 13) / 6))), kind = "grass", water = null, wkind = null;
    if (strip) top = 0;
    if (d < 3.6) { top = d < 2.2 ? -3 : -2; kind = bedKind; water = 0; wkind = "river"; }
    else if (edge !== "none" && top <= PLAIN) {
      const bend = -Math.sin(nr.xx / 10), side = Math.sign(z + 0.5 - zc(nr.xx));
      if (edge === "stripe") { if (out < 1.3) kind = "sand"; }
      else if (edge === "mix") { if (out < Math.min(bank, 1.1 + 0.8 * wobble(x, z))) kind = hash(x, z) < 0.35 ? "mud" : out < 0.9 ? "wetsilt" : "silt"; }
      else {
        // bars on the inside of bends fill the low strip, wider where the bend is sharp; on the outside a thin wet line
        const inner = side * bend > 0, width = inner ? Math.min(bank, 0.6 + 3.6 * Math.pow(Math.abs(bend), 0.8)) : 0.15;
        if (out < width + 0.5 * wobble(x, z)) {
          kind = edge === "sandbars" ? "sand" : out < 1.1 ? "wetsilt" : "silt";
          if (edge === "siltmud") {
            // animals trample the waterline to mud; the low hollows between the bar's ridges hold mud too
            if (out < 1.1 && hash(x, z) < 0.45) kind = "mud";
            else if (width > 2.4 && out > 1.6 && out < 2.4 + 0.4 * wobble(z, x) && hash(x + 3, z) < 0.75) kind = "mud";
          } else if (edge === "graded") {
            // the current drops sand first, at the bar's upstream head, and the fine silt and mud at its tail
            const head = bend * -Math.cos(nr.xx / 10) > 0;
            if (head) kind = out < 1.1 ? "wetsilt" : hash(x, z) < 0.8 ? "sand" : "silt";
            else kind = out < 1.1 ? (hash(x, z) < 0.6 ? "mud" : "wetsilt") : "silt";
            if (head && out < 1.1 && hash(x + 7, z) < 0.5) kind = "sand";
          }
          if (top > 0) top = 0; // a bar never stands on the plain: it lies on the low strip
          if (inner && Math.abs(bend) > 0.55 && out < 0.9) { top = -1; water = 0; wkind = "river"; } // shallows over the bar's foot
        }
      }
    }
    const oc = Math.hypot(x + 0.5 - 20, z + 0.5 - 53);
    if (z + 0.5 <= 53.5 && oc >= 6 && oc <= 8.6) {
      water = PLAIN; wkind = "pool"; top = (oc > 6.9 && oc < 7.7 && z < 50) ? PLAIN - 2 : PLAIN - 1; kind = "mud";
    } else if (z + 0.5 <= 54 && z + 0.5 > 51 && oc >= 5 && oc <= 9.6 && water === null) kind = "mud";
    const pe = Math.hypot((x + 0.5 - 54) / 5.5, (z + 0.5 - 13.3) / 3.8);
    if (pe < 1) { water = PLAIN; wkind = "pool"; top = PLAIN - 1; kind = "mud"; }
    else if (pe < 1.45 && water === null) kind = "mud";
    const t = Math.max(0, Math.min(1, (d - 19) / 6));
    const g = new THREE.Color(flood).lerp(new THREE.Color(plain), t);
    col.push({ x, z, top, kind, water, wkind, g, side: t < 0.5 ? "F" : "P" });
  }
  const at = (x, z) => (x < 0 || z < 0 || x >= X || z >= Z) ? null : col[x * Z + z];
  // materials
  const shade = [0.6, 0.6, 1, 0.5, 0.8, 0.8];
  const boxMats = map => shade.map((s, i) => new THREE.MeshBasicMaterial({ map: map[i] || map[0], color: new THREE.Color(s, s, s) }));
  const dirt = tex(canvasOf(IMG.dirt)), sand = tex(canvasOf(IMG.sand)), mud = tex(canvasOf(IMG.mud));
  const silt = tex(siltOf(false)), wetsilt = tex(siltOf(true));
  const sideOf = h => { const c = canvasOf(IMG.dirt); c.getContext("2d").drawImage(tinted(IMG.grass_block_side_overlay, h), 0, 0); return tex(c); };
  const sideF = sideOf(flood), sideP = sideOf(plain);
  const mats = {
    grassF: boxMats([sideF, sideF, dirt, dirt, sideF, sideF]), grassP: boxMats([sideP, sideP, dirt, dirt, sideP, sideP]),
    dirt: boxMats([dirt]), sand: boxMats([sand]), mud: boxMats([mud]), silt: boxMats([silt]), wetsilt: boxMats([wetsilt]),
  };
  const cells = { grassF: [], grassP: [], dirt: [], sand: [], mud: [], silt: [], wetsilt: [] };
  const tops = { grass: [], sand: [], dirt: [], mud: [], silt: [], wetsilt: [] };
  for (const c of col) {
    let low = c.top;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = at(c.x + dx, c.z + dz); low = Math.min(low, n ? n.top + 1 : -4); }
    for (let y = Math.max(low, -4); y <= c.top; y++) {
      let k = y < c.top ? ((c.kind === "sand" || c.kind === "silt") && y === c.top - 1 ? c.kind : c.kind === "wetsilt" && y === c.top - 1 ? "silt" : "dirt")
        : c.kind === "grass" ? "grass" + c.side : c.kind;
      cells[k].push([c.x, y, c.z]);
    }
    tops[c.kind].push(c);
  }
  const box = new THREE.BoxGeometry(1, 1, 1), m4 = new THREE.Matrix4();
  for (const k in cells) {
    if (!cells[k].length) continue;
    const mesh = new THREE.InstancedMesh(box, mats[k], cells[k].length);
    cells[k].forEach(([x, y, z], i) => mesh.setMatrixAt(i, m4.makeTranslation(x + 0.5, y + 0.5, z + 0.5)));
    scene.add(mesh);
  }
  const plane = new THREE.PlaneGeometry(1, 1); plane.rotateX(-Math.PI / 2);
  const topTex = { grass: tex(canvasOf(IMG.grass_block_top)), sand, dirt, mud, silt, wetsilt };
  for (const k in tops) {
    if (!tops[k].length) continue;
    const mesh = new THREE.InstancedMesh(plane, new THREE.MeshBasicMaterial({ map: topTex[k] }), tops[k].length);
    tops[k].forEach((c, i) => {
      mesh.setMatrixAt(i, m4.makeTranslation(c.x + 0.5, c.top + 1.002, c.z + 0.5));
      mesh.setColorAt(i, k === "grass" ? c.g : new THREE.Color(1, 1, 1));
    });
    scene.add(mesh);
  }
  for (const [wk, opt] of [["river", river], ["pool", pool]]) {
    const ws = col.filter(c => c.wkind === wk);
    if (!ws.length) continue;
    const wt = tex(tinted(IMG.water_still, opt[1], 16, 16));
    const mat = new THREE.MeshBasicMaterial({ map: wt, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    const mesh = new THREE.InstancedMesh(box, mat, ws.length);
    ws.forEach((c, i) => {
      const bottom = c.top + 1, h = c.water + 0.875 - bottom;
      m4.makeScale(1, h, 1).setPosition(c.x + 0.5, bottom + h / 2, c.z + 0.5);
      mesh.setMatrixAt(i, m4);
    });
    scene.add(mesh);
  }
  if (state.view === 1) {
    scene.fog = new THREE.Fog(river[2], 0.3, 14); scene.background = new THREE.Color(river[2]);
    camera.position.set(6, -1.2, zc(6)); controls.target.set(30, -1.6, zc(30));
  } else {
    scene.fog = null; scene.background = new THREE.Color(0x78A7FF);
  }
  controls.update();
}

function buttons() {
  const panel = document.getElementById("panel");
  for (const key in OPTIONS) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<b>${OPTIONS[key].label}</b>`;
    OPTIONS[key].list.forEach((o, i) => {
      const b = document.createElement("button");
      const c = typeof o[1] === "number" && key !== "bank" && key !== "sand" ? o[1] : o[1] === "savanna" ? SAVANNA : o[1] === "plains" ? PLAINS : null;
      b.innerHTML = (c !== null && c !== undefined && key !== "sand" ? `<span class="sw" style="background:${hexCss(c)}"></span>` : "") + o[0];
      b.className = state[key] === i ? "on" : "";
      b.onclick = () => {
        state[key] = i; [...row.querySelectorAll("button")].forEach((x, j) => x.className = j === i ? "on" : "");
        if (key === "view" && i === 0) { camera.position.set(78, 30, -8); controls.target.set(38, 0, 30); }
        build();
      };
      row.appendChild(b);
    });
    panel.appendChild(row);
  }
}

function resize() {
  const c = renderer.domElement, w = c.clientWidth, h = c.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

(async () => {
  for (const k of ["grass_block_top", "grass_block_side_overlay", "dirt", "sand", "mud", "water_still", "grass_colormap"]) IMG[k] = await load(D[k]);
  const cm = canvasOf(IMG.grass_colormap).getContext("2d");
  const px = (i, j) => { const p = cm.getImageData(i, j, 1, 1).data; return p[0] << 16 | p[1] << 8 | p[2]; };
  SAVANNA = px(0, 255); PLAINS = px(51, 173);
  buttons(); build(); resize();
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
