// What every mod folder of this repository shares (the split, step S6, docs/plans/mod-split.md): Java 21, the NeoForge
// and GeckoLib versions, the unit tests and the mod file (META-INF/neoforge.mods.toml) filled in from
// gradle.properties. Each folder's own build.gradle applies the plugins, then this file, then names its mods.

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        // TerraBlender (big savannas, 2026-11-06): Glitchfiend's biome region library, shared with Biomes O' Plenty
        name = "Glitchfiend"
        url = "https://maven.minecraftforge.net/"
        content { includeGroup "com.github.glitchfiend" }
    }
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    exclude("**/*.bbmodel") // BlockBench project files
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.9.3"

    // Automatic tests (run by ./gradlew build): the route planner is tested on a pretend nest, and so on.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// The mod file: src/main/templates is filled in with the names and versions from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            framework_mod_id       : framework_mod_id,
            framework_mod_name     : framework_mod_name,
            terrablender_version   : terrablender_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Test speed step 1 (docs/plans/test-speed.md, 2026-11-22): the test classes run side by side in one test program
// (JUnit's own side-by-side mode; the tests of one class still one after another), and a test tagged @Tag("slow") (a long
// random sweep that cannot get faster) is left out of the everyday build. -PslowTests runs only the slow ones;
// tools/run_game_tests.sh does that in every full run. Not 4 programs side by side: they share build/minecraft-junit and
// each rewrites config/fml.toml as it starts, so one read the other's half-written file and failed to start. A class
// that flips a shared switch takes a lock (@ResourceLock("TreeDraw") in the tree tests) so no class reading it runs beside.
tasks.named('test', Test) {
    useJUnitPlatform {
        if (project.hasProperty('slowTests')) {
            includeTags 'slow'
        } else {
            excludeTags 'slow'
        }
    }
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
