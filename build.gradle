// The root of the repository only runs the game (the split, step S6, docs/plans/mod-split.md): each mod is a folder
// of its own (framework\ the colony framework "colonyframework", savanna\ the savanna mod "antcolonies", desert\ the
// desert mod "desertcolonies" since step S7), built and tested together. The commands and run folders are the same as
// before the split: ./gradlew build, runClient, runGameTestServer, runGameTestShard1..n (tools/run_game_tests.sh),
// runFilm; the worlds stay in run\, run-test\, run-test-shards\ and run-film\.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

evaluationDependsOn(':framework')
evaluationDependsOn(':savanna')
evaluationDependsOn(':desert')

// Which species mods the game is started with (the split, step S9: each mod on its own). Both by default;
// -PspeciesMods=savanna starts the framework with the savanna mod only, -PspeciesMods=desert with the desert mod only
// (tools/run_game_tests.sh passes ANTCOLONIES_MODS on). The mods left out are not on the game's classpath at all.
def speciesMods = (project.findProperty('speciesMods') ?: 'savanna,desert').toString().split(',')*.trim().findAll { it }
speciesMods.each { if (!(it in ['savanna', 'desert'])) throw new GradleException("speciesMods: unknown mod '${it}' (savanna, desert)") }
def withSavanna = 'savanna' in speciesMods
def withDesert = 'desert' in speciesMods

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The root has no code of its own: nothing to pack.
tasks.named('jar') { enabled = false }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // The savanna mod's access file, so the game started from here has the same Minecraft as the savanna mod is built on.
    if (withSavanna) {
        accessTransformers = project.files('savanna/src/main/resources/META-INF/accesstransformer.cfg')
    }

    // Every species mod's game tests (each mod's tests sit under its own name since the split, step S7).
    def gameTestNamespaces = ((withSavanna ? [project.mod_id] : []) + (withDesert ? [project.desert_mod_id] : [])).join(',')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // Its own folder, so test worlds never touch the real game's saves.
            gameDirectory = project.file('run-test')
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        // Tests side by side (tools/run_game_tests.sh): one more game test server per share of the tests, each in its
        // own folder and world. How many: -PtestShards=n (5 if not given; the PC has 20 threads and 64 GB).
        def testShards = (project.findProperty('testShards') ?: '5') as int
        (1..testShards).each { shard ->
            register("gameTestShard${shard}") {
                type = "gameTestServer"
                gameDirectory = project.file("run-test-shards/${shard}")
                systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
                systemProperty 'antcolonies.shard', "${shard}/${testShards}"
            }
        }

        // The in-game camera (client/FilmDirector, development only): a fresh flat creative world, a shot list played
        // and its screenshots saved to run-film/screenshots, then the game quits. Claude's eyes in the real game.
        // ./gradlew runFilm  (the poses scene)  or  ./gradlew runFilm -PfilmScene=tools/film/<scene>.film
        // several in one launch: -PfilmScene=tools/film/climb.film,tools/film/work.film  or  -PfilmScene=all
        // Short names work too: -PfilmScene=climb is tools/film/climb.film, -PfilmScene=guard the folder tools/film/guard.
        // Watch mode (client/FilmWatch; tools/film.sh watch): -PfilmWatch keeps the camera open after its scenes and
        // shoots them again whenever the animation or model files (or the shot lists) change, or tools/film.sh shoot asks.
        film {
            client()
            gameDirectory = project.file('run-film')
            def scenes = (project.findProperty('filmScene') ?: 'tools/film/poses.film').toString()
            systemProperty 'antcolonies.film', (scenes == 'all' ? ['tools/film'] : scenes.split(',').toList())
                    .collect { def name = it.trim()
                        project.file(name).exists() ? project.file(name).absolutePath
                                : project.file("tools/film/${name}.film").exists() ? project.file("tools/film/${name}.film").absolutePath
                                : project.file("tools/film/${name}").absolutePath }.join(',')
            if (project.hasProperty('filmWatch')) {
                systemProperty 'antcolonies.film.watch', 'true'
                // every mod's files are watched (each mod's own folder; tools/mod_paths.py knows the same list)
                def modFolders = ['framework', 'savanna', 'desert']
                systemProperty 'antcolonies.film.src', modFolders.collect { project.file("${it}/src/main/resources").absolutePath }.join(File.pathSeparator)
                systemProperty 'antcolonies.film.out', modFolders.collect { project.file("${it}/build/resources/main").absolutePath }.join(File.pathSeparator)
                systemProperty 'antcolonies.film.project', project.projectDir.absolutePath
            }
            // -PfilmDebug: the game listens for the debugger on port 5005, so tools/film.sh swap can swap changed Java
            // method bodies into it (tools/film_swap.py) without a relaunch
            if (project.hasProperty('filmDebug')) {
                jvmArguments.add '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            }
            programArguments.addAll '--width', '960', '--height', '540'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('savanna/src/generated/resources/').getAbsolutePath(), '--existing', file('savanna/src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // The mods the game is started with, and where each one's code and files are.
    mods {
        "${framework_mod_id}" {
            sourceSet(project(':framework').sourceSets.main)
        }
        if (withSavanna) {
            "${mod_id}" {
                sourceSet(project(':savanna').sourceSets.main)
            }
        }
        if (withDesert) {
            "${desert_mod_id}" {
                sourceSet(project(':desert').sourceSets.main)
            }
        }
    }
}

dependencies {
    // Every mod's code and the libraries it needs (GeckoLib) on the game's classpath.
    implementation project(':framework')
    if (withSavanna) {
        implementation project(':savanna')
    }
    if (withDesert) {
        implementation project(':desert')
    }
}

// The in-game camera starts clean each time (a new world, no old screenshots) with quiet, never-pausing settings.
def filmDir = file('run-film')
tasks.matching { it.name == 'runFilm' }.configureEach {
    doFirst {
        new File(filmDir, 'saves/film').deleteDir()
        new File(filmDir, 'screenshots').deleteDir()
        def options = new File(filmDir, 'options.txt')
        if (!options.exists()) {
            filmDir.mkdirs()
            options.text = ['onboardAccessibility:false', 'pauseOnLostFocus:false', 'renderDistance:4', 'particles:2', 'simulationDistance:5',
                            'renderClouds:"false"', 'bobView:false', 'narrator:0', 'tutorialStep:none', 'joinedFirstServer:true',
                            'skipMultiplayerWarning:true', 'soundCategory_master:0.0', 'guiScale:2'].join(System.lineSeparator()) + System.lineSeparator()
        }
    }
}
