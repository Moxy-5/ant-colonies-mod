// The root of the repository only runs the game (the split, step S6, docs/plans/mod-split.md): each mod is a folder
// of its own (framework\ the colony framework "colonyframework", savanna\ the savanna mod "antcolonies"; the desert mod
// "desertcolonies" was taken out 2026-11-23), built and tested together. The commands and run folders are the same as
// before the split: ./gradlew build, runClient, runGameTestServer, runGameTestShard1..n (tools/run_game_tests.sh),
// runFilm; the worlds stay in run\, run-test\, run-test-shards\ and run-film\.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

evaluationDependsOn(':framework')
evaluationDependsOn(':savanna')

// Which species mods the game is started with (the split, step S9: each mod on its own). Today the savanna mod is
// the only one (-PspeciesMods=savanna, the default); a new species mod adds its name here
// (tools/run_game_tests.sh passes ANTCOLONIES_MODS on). The mods left out are not on the game's classpath at all.
def speciesMods = (project.findProperty('speciesMods') ?: 'savanna').toString().split(',')*.trim().findAll { it }
speciesMods.each { if (!(it in ['savanna'])) throw new GradleException("speciesMods: unknown mod '${it}' (savanna)") }
def withSavanna = 'savanna' in speciesMods

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        // TerraBlender (big savannas, 2026-11-06): Glitchfiend's biome region library, shared with Biomes O' Plenty
        name = "Glitchfiend"
        url = "https://maven.minecraftforge.net/"
        content { includeGroup "com.github.glitchfiend" }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The root has no code of its own: nothing to pack.
tasks.named('jar') { enabled = false }

// No bug number used twice in docs/BUGS.md (branches merge the notes by keeping both sides' lines, .gitattributes;
// new numbers come from tools/bug_number.py, the rule in CLAUDE.md, "Notes on branches").
def checkBugNumbers = tasks.register('checkBugNumbers') {
    def bugs = file('docs/BUGS.md')
    inputs.file(bugs)
    doLast {
        def seen = [] as Set
        def twice = []
        (bugs.getText('UTF-8') =~ /(?m)^(\d+[a-z]?)\. /).each { all, name -> if (!seen.add(name)) twice << name }
        if (twice) {
            throw new GradleException("docs/BUGS.md: bug numbers used twice: ${twice.join(', ')}. Give the newer one a " +
                    "new number from 'python tools/bug_number.py' and change every place that names it.")
        }
    }
}
tasks.named('check') { dependsOn checkBugNumbers }

// The list of code review findings (docs/CODE-REVIEW-BUGS.md) is written by tools/review_bugs.py from the review
// files; this fails when a finding or a status line was added there and the list not written again.
def checkReviewBugs = tasks.register('checkReviewBugs', Exec) {
    commandLine 'python', 'tools/review_bugs.py', '--check'
}
tasks.named('check') { dependsOn checkReviewBugs }

// The spot tables (assets/<mod>/spots/, where one animal touches another: the Motion Studio, phase 3) are written by
// tools/spots.py from the body plans and the game's model and clip files; this fails when one is behind them.
def checkSpotTables = tasks.register('checkSpotTables', Exec) {
    commandLine 'python', 'tools/spots.py', '--check'
}
tasks.named('check') { dependsOn checkSpotTables }

// The animation engine's own checks, checked (tools/engine_selftest.py, code review round 12): each test breaks a
// real clip or recording the way a real fault would and expects the check to say so. Runs again only when a tool, a
// body plan, a model or a clip has changed (about 15 seconds).
def checkEngineTools = tasks.register('checkEngineTools', Exec) {
    def marker = layout.buildDirectory.file('engine_selftest.txt')
    inputs.files(fileTree('tools') { include '*.py' })
    inputs.files(fileTree('savanna/src/main/resources/assets/antcolonies') {
        include 'animations/**', 'geo/**', 'body_plans/**', 'block_moves/**'
    })
    outputs.file(marker)
    commandLine 'python', 'tools/engine_selftest.py'
    doLast { marker.get().asFile.text = 'passed' }
}
tasks.named('check') { dependsOn checkEngineTools }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // The savanna mod's access file, so the game started from here has the same Minecraft as the savanna mod is built on.
    if (withSavanna) {
        accessTransformers = project.files('savanna/src/main/resources/META-INF/accesstransformer.cfg')
    }

    // Every species mod's game tests (each mod's tests sit under its own name since the split, step S7).
    def gameTestNamespaces = (withSavanna ? [project.mod_id] : []).join(',')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Smooth frames (2026-11-12, the user's "constant stuttering"): Java's usual memory cleaner (G1) stops the
            // whole game 20 to 50 ms about once a second while land loads; the Z cleaner works beside the game with
            // stops under a millisecond. -PclientGc=g1 goes back to the old one to compare.
            if ((project.findProperty('clientGc') ?: 'z').toString() != 'g1') {
                jvmArguments.add '-XX:+UseZGC'
                jvmArguments.add '-XX:+ZGenerational'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // Its own folder, so test worlds never touch the real game's saves.
            gameDirectory = project.file('run-test')
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
        }

        // Tests side by side (tools/run_game_tests.sh): one more game test server per share of the tests, each in its
        // own folder and world. How many: -PtestShards=n (5 if not given; the PC has 20 threads and 64 GB).
        // -PtestShardsFolder=<folder> puts the servers' folders somewhere else (test revamp R1: the reruns of failed tests
        // go to run-test-reruns/<n>, so the run's own logs stay where they were).
        def testShards = (project.findProperty('testShards') ?: '5') as int
        def testShardsFolder = (project.findProperty('testShardsFolder') ?: 'run-test-shards').toString()
        (1..testShards).each { shard ->
            register("gameTestShard${shard}") {
                type = "gameTestServer"
                gameDirectory = project.file("${testShardsFolder}/${shard}")
                systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
                systemProperty 'antcolonies.shard', "${shard}/${testShards}"
                // Each test's last minutes, so the servers share the tests out by length (test speed step 2)
                systemProperty 'antcolonies.testTimes', project.file('tools/test-times.txt').absolutePath
            }
        }

        // The raid test bench's soak runs (round 2, B4; tools/soak.sh): headless servers on real generated worlds, each
        // in its own folder, running a savanna patch flat out for -PsoakDays game days while a pretend player pokes at
        // the raids (watch/Soak). How many: -PsoakShards=n (4 if not given).
        def soakShards = (project.findProperty('soakShards') ?: '4') as int
        def soakDays = (project.findProperty('soakDays') ?: '1').toString()
        (1..soakShards).each { shard ->
            register("soakShard${shard}") {
                server()
                programArgument '--nogui'
                gameDirectory = project.file("run-soak/${shard}")
                systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
                systemProperty 'antcolonies.soak', 'true'
                systemProperty 'antcolonies.soakDays', soakDays
            }
        }

        // The flight run (savanna loading round 2, L1; tools/flight.sh): a headless server makes a new normal world in
        // run-flight and a pretend player flies east from the spawn for -PflightSeconds (120) at view distance 12, then
        // it writes run-flight/flight-report.txt (stalls, land in view made, tick time) and stops (watch/Flight).
        // -PflightOld wires the land the old way (FlatSavanna.Shared off), for a before-and-after on the same land.
        flight {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-flight')
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces
            systemProperty 'antcolonies.flight', (project.findProperty('flightSeconds') ?: '120').toString()
            // -PflightProfile: Java's flight recorder samples the run, written to run-flight/flight.jfr (read it with
            // python tools/film_profile.py server)
            if (project.hasProperty('flightProfile')) {
                jvmArguments.add '-XX:StartFlightRecording=filename=flight.jfr,settings=profile,dumponexit=true'
            }
            if (project.hasProperty('flightStand')) {
                // (Far colonies' speed: the pretend player stands at one colony and the stopwatch is averaged.)
                systemProperty 'antcolonies.flight.stand', 'true'
            }
            if (project.hasProperty('flightVisits')) {
                // (The coming-back tick: while standing, the pretend player leaves the colony and comes back over and over.)
                systemProperty 'antcolonies.flight.stand', 'true'
                systemProperty 'antcolonies.flight.visits', 'true'
                systemProperty 'antcolonies.slowBrainMs', '20'
            }
            if (project.hasProperty('flightOld')) {
                systemProperty 'antcolonies.landWiringOld', 'true'
            }
        }

        // The in-game camera (client/FilmDirector, development only): a fresh flat creative world, a shot list played
        // and its screenshots saved to run-film/screenshots, then the game quits. Claude's eyes in the real game.
        // ./gradlew runFilm  (the poses scene)  or  ./gradlew runFilm -PfilmScene=tools/film/<scene>.film
        // several in one launch: -PfilmScene=tools/film/climb.film,tools/film/work.film  or  -PfilmScene=all
        // Short names work too: -PfilmScene=climb is tools/film/climb.film, -PfilmScene=guard the folder tools/film/guard.
        // Watch mode (client/FilmWatch; tools/film.sh watch): -PfilmWatch keeps the camera open after its scenes and
        // shoots them again whenever the animation or model files (or the shot lists) change, or tools/film.sh shoot asks.
        film {
            client()
            gameDirectory = project.file('run-film')
            def scenes = (project.findProperty('filmScene') ?: 'tools/film/poses.film').toString()
            systemProperty 'antcolonies.film', (scenes == 'all' ? ['tools/film'] : scenes.split(',').toList())
                    .collect { def name = it.trim()
                        project.file(name).exists() ? project.file(name).absolutePath
                                : project.file("tools/film/${name}.film").exists() ? project.file("tools/film/${name}.film").absolutePath
                                : project.file("tools/film/${name}").absolutePath }.join(',')
            if (project.hasProperty('filmWatch')) {
                systemProperty 'antcolonies.film.watch', 'true'
                // every mod's files are watched (each mod's own folder; tools/mod_paths.py knows the same list)
                def modFolders = ['framework', 'savanna']
                systemProperty 'antcolonies.film.src', modFolders.collect { project.file("${it}/src/main/resources").absolutePath }.join(File.pathSeparator)
                systemProperty 'antcolonies.film.out', modFolders.collect { project.file("${it}/build/resources/main").absolutePath }.join(File.pathSeparator)
                systemProperty 'antcolonies.film.project', project.projectDir.absolutePath
            }
            // -PfilmDebug: the game listens for the debugger on port 5005, so tools/film.sh swap can swap changed Java
            // method bodies into it (tools/film_swap.py) without a relaunch
            // -PfilmRawFrames: every frame's drawing time in order, run-film/screenshots/frames_<scene>.txt (FilmFrameMeter)
            if (project.hasProperty('filmRawFrames')) {
                systemProperty 'antcolonies.film.rawFrames', 'true'
            }
            // -PplainBoxes: GeckoLib's own box drawing in place of the ready-made faces (client/BoneMesh), to compare
            if (project.hasProperty('plainBoxes')) {
                systemProperty 'antcolonies.plainBoxes', 'true'
            }
            // -PposeReuse=half (or never): far insects' kept poses (client/PoseMemory) every other frame at any distance,
            // to measure them (films work every pose out otherwise)
            if (project.hasProperty('poseReuse')) {
                systemProperty 'antcolonies.poseReuse', project.property('poseReuse').toString()
            }
            // -PfilmProfile: Java's own flight recorder samples where the game's time goes while filming, written to
            // run-film/film.jfr (read it with tools/film_profile.py)
            if (project.hasProperty('filmProfile')) {
                jvmArguments.add '-XX:StartFlightRecording=filename=film.jfr,settings=profile,dumponexit=true'
            }
            // -PfarLook=always (or never): every insect with a far model drawn with it (or never), for measuring and
            // for comparing the two looks (client/InsectModel.pickLook; films keep the full model otherwise)
            if (project.hasProperty('farLook')) {
                systemProperty 'antcolonies.farLook', project.property('farLook').toString()
            }
            if (project.hasProperty('filmDebug')) {
                jvmArguments.add '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            }
            programArguments.addAll '--width', '960', '--height', '540'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('savanna/src/generated/resources/').getAbsolutePath(), '--existing', file('savanna/src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // The mods the game is started with, and where each one's code and files are.
    mods {
        "${framework_mod_id}" {
            sourceSet(project(':framework').sourceSets.main)
        }
        if (withSavanna) {
            "${mod_id}" {
                sourceSet(project(':savanna').sourceSets.main)
            }
        }
    }
}

dependencies {
    // Every mod's code and the libraries it needs (GeckoLib) on the game's classpath.
    implementation project(':framework')
    if (withSavanna) {
        implementation project(':savanna')
    }
}

// The in-game camera starts clean each time (a new world, no old screenshots) with quiet, never-pausing settings.
def filmDir = file('run-film')
tasks.matching { it.name == 'runFilm' }.configureEach {
    doFirst {
        // One film at a time on the PC (code review R12-46; tools/film_run.py holds the lock and sets the variable for
        // its own launch): a launch typed by hand stops here while a tool's film is running, before it deletes that
        // film's world and pictures. (A lock left by a tool that is gone is ignored.)
        def lock = new File(System.getProperty('java.io.tmpdir'), 'antcolonies_film.lock')
        if (lock.exists() && System.getenv('ANTCOLONIES_FILM_LOCK') == null) {
            def held = new groovy.json.JsonSlurper().parseText(lock.text)
            if (ProcessHandle.of(held.pid as long).map { it.isAlive() }.orElse(false)) {
                throw new GradleException("a film is already running: ${held.what} in ${held.folder} (process ${held.pid}, " +
                        "since ${held.since}); films run one at a time. Wait for it, or delete ${lock} if that process is not a film.")
            }
        }
        new File(filmDir, 'saves/film').deleteDir()
        new File(filmDir, 'screenshots').deleteDir()
        def options = new File(filmDir, 'options.txt')
        if (!options.exists()) {
            filmDir.mkdirs()
            options.text = ['onboardAccessibility:false', 'pauseOnLostFocus:false', 'renderDistance:4', 'particles:2', 'simulationDistance:5',
                            'renderClouds:"false"', 'bobView:false', 'narrator:0', 'tutorialStep:none', 'joinedFirstServer:true',
                            'skipMultiplayerWarning:true', 'soundCategory_master:0.0', 'guiScale:2'].join(System.lineSeparator()) + System.lineSeparator()
        }
    }
}
